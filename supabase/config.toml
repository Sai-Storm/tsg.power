project_id = "tsg-power"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Configure GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in your Supabase project
# (Dashboard -> Authentication -> Providers -> Google) or export them locally.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.admin-users]
verify_jwt = true
